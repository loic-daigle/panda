name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            test "$version" = "${configured_version}rc"
          else
            test "$version" = "$configured_version"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build Panda
        run: pio run -e gh_release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panda ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/partitions.bin

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: Panda-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/partitions.bin
